<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Capture ideas before they disappear.</p>
  </header>
  
  <main>
    <section class="card">
      <h2>Add a note</h2>
      <form id="note-form">
        <div class="form-group">
          <label for="note-input">Your note:</label>
          <input type="text" id="note-input" placeholder="Type a note...">
        </div>
        
        <div class="form-group">
          <label for="note-category">Category:</label>
          <select id="note-category">
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
          </select>
        </div>
        
        <button type="submit">Add Note</button>
      </form>
      <p id="error-message"></p>
    </section>

    <section class="card">
      <h2>Your notes</h2>
      <div class="controls">
        <input type="text" id="search-input" placeholder="Search notes...">
        <button id="clear-all-btn">Clear all</button>
      </div>
      <p id="note-count">You have no notes yet.</p>
      <ul id="notes-list"></ul>
    </section>
  </main>
  
  <footer>
    <p>&copy; 2026 QuickNotes. Built for Web Foundations.</p>
  </footer>
</body>
</html>
